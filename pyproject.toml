[project]
name = "beer-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent-framework>=1.1.0",
    "duckdb>=1.5.3",
    "matplotlib>=3.10.8",
    "openai>=2.32.0",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.41.0"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "pytest>=8.4.0",
]
